name: Release

# Publishes a GitHub Release for a pushed version tag, mirroring the
# create-release-then-build split used by mrgeneko/NeuralAmpModelerPlugin's
# release-native.yml (the macOS/Windows counterpart to this Linux build).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# The repository default for GITHUB_TOKEN is read-only, so creating a release
# and uploading its assets both fail with "Resource not accessible by
# integration". Scope the write here rather than loosening the repo-wide
# default, which would also apply to build.yml.
permissions:
  contents: write

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    # Release names come from the ref, so dispatching this against a branch
    # would create a release tagged "master". workflow_dispatch can still
    # target a tag -- pick one in the ref dropdown -- which is the useful
    # case, e.g. re-running a release whose build failed.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # release_notes_header.md carries the Downloads / Before-you-install
      # sections (asset name, glibc requirement) that changelog.txt itself
      # doesn't have -- that's just the changelog.
      # __VERSION__ is the CMakeLists.txt project version (e.g. "0.5.0"),
      # NOT github.ref_name ("v0.5.0") -- makedist-linux.sh names the
      # archive from CMakeLists.txt directly, with no "v" prefix, unlike
      # NeuralAmpModelerPlugin's archives which match the tag exactly.
      - name: Build release notes
        run: |
          VERSION="$(sed -n -E 's/^project\(namix VERSION ([^ ]+).*/\1/p' CMakeLists.txt)"
          sed "s/__VERSION__/$VERSION/g" release_notes_header.md > /tmp/release_notes.md
          cat changelog.txt >> /tmp/release_notes.md
        shell: bash

      # Creating the release up front (rather than letting the build job
      # create it) matters once there's more than one build job racing to
      # create the same one; kept as a separate job here too so the two
      # repos stay structurally comparable.
      - name: Create draft release
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          if gh release view "${{github.ref_name}}" --repo "${{github.repository}}" >/dev/null 2>&1; then
            echo "Release ${{github.ref_name}} already exists; updating its notes."
            gh release edit "${{github.ref_name}}" \
              --repo "${{github.repository}}" \
              --notes-file /tmp/release_notes.md
          else
            gh release create "${{github.ref_name}}" \
              --repo "${{github.repository}}" \
              --draft \
              --title "NAMix ${{github.ref_name}}" \
              --notes-file /tmp/release_notes.md
          fi
        shell: bash

      # Demo parametric models the settings-page knobs exist to drive. Nothing
      # installs a model, so without these a user has no way to exercise that
      # feature on a fresh install. muffinator_v4_optimal.param.nam stays in
      # ParametricModels/ for StateRestoreTests.cpp but is no longer shipped
      # as a release download -- these 11 replace it.
      - name: Upload demo parametric models
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh release upload "${{github.ref_name}}" \
            ParametricModels/large-muffin.nam \
            ParametricModels/british-800-preamp.nam \
            ParametricModels/cali-duo-reverb-85watt.nam \
            ParametricModels/dirty-hamster.nam \
            ParametricModels/clone-overdrive.nam \
            ParametricModels/special-bundle-overdrive-183-rock-channel.nam \
            ParametricModels/vinny-iii-drive.nam \
            ParametricModels/brit-in-a-box.nam \
            ParametricModels/special-bundle-overdrive-183-jazz-channel.nam \
            ParametricModels/anxiety-drive.nam \
            ParametricModels/green-mids-overdrive.nam \
            --repo "${{github.repository}}" \
            --clobber
        shell: bash

  build-linux:
    name: Build and package (Linux)
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl-dev libfreetype-dev libfontconfig-dev libpng-dev zlib1g-dev \
            libcurl4-openssl-dev libasound2-dev libwebkit2gtk-4.1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      # Runs its own cmake configure/build again (fast: incremental, nothing changed since
      # the steps above) -- kept self-contained so the script also works standalone for a
      # local release build, not just from this job.
      - name: Package release archive
        run: bash scripts/makedist-linux.sh

      # gh upload fails on a missing/unmatched path, so a packaging step that
      # silently produced no tarball fails the job here rather than finishing
      # green with nothing attached to the release.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh release upload "${{github.ref_name}}" \
            dist/NAMix-*-linux-*.tar.gz \
            --repo "${{github.repository}}" \
            --clobber
        shell: bash

  build-macos:
    name: Build and package (macOS)
    needs: create_release
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      # Imports the Developer ID Application certificate into a CI-local keychain rather
      # than the runner's default login keychain, which is torn down with the VM anyway --
      # this just keeps codesign from needing to unlock/search anything unexpected.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Lets codesign use the imported key non-interactively (no keychain-unlock
          # prompt), which would otherwise hang a headless CI run indefinitely.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Sign and notarize
        env:
          SIGN_IDENTITY: "Developer ID Application: Gene Ko (QD3S486P93)"
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          export NOTARY_API_KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          bash scripts/sign-notarize-macos.sh
          rm -f "$RUNNER_TEMP/notary_key.p8"

      - name: Package release archive
        run: bash scripts/makedist-macos.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh release upload "${{github.ref_name}}" \
            dist/NAMix-*-macos-*.zip \
            --repo "${{github.repository}}" \
            --clobber
        shell: bash

  build-windows:
    name: Build and package (Windows)
    needs: create_release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package release archive
        run: ./scripts/makedist-windows.ps1

      - name: Upload release assets
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh release upload "${{github.ref_name}}" `
            (Get-Item dist/NAMix-*-windows-*.zip) `
            --repo "${{github.repository}}" `
            --clobber
        shell: pwsh
